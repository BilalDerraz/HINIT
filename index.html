    <!-- structured data: helps Google show the business card / rich result -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "HinIT",
        "description": "Beheer, beveiliging en support van IT voor groeiende bedrijven in Nederland.",
        "url": "https://hinit.nl/",
        "logo": "https://hinit.nl/favicon-512.png",
        "image": "https://hinit.nl/og-image.png",
        "email": "info@hinit.nl",
        "telephone": "+31684018864",
        "areaServed": { "@type": "Country", "name": "Nederland" },
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Amsterdam",
          "addressCountry": "NL"
        },
        "openingHoursSpecification": {
          "@type": "OpeningHoursSpecification",
          "dayOfWeek": ["Monday", "Tuesday", "Wednesday", "Thursday", "Friday"],
          "opens": "08:00",
          "closes": "18:00"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Apply the saved theme before first paint so there is no flash of the
      // wrong colours. Mirrors the logic in src/theme.jsx — keep them in step.
      (function () {
        var t;
        try {
          var m = document.cookie.match(/(?:^|;\s*)hinit_theme=([^;]*)/);
          if (m) t = decodeURIComponent(m[1]);
        } catch (e) {}
        if (t !== 'light' && t !== 'dark') {
          t =
            window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches
              ? 'light'
              : 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', t === 'light' ? '#f2f4f9' : '#0a0d1a');
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
